    <text x="360" y="205" fill="#f5f7fb" font-size="104" font-weight="800" letter-spacing="-5">MINGRX</text>
    <text x="365" y="270" fill="#b7bcc8" font-size="30" font-weight="500">voice · chat · screen sharing</text>
    <text x="365" y="326" fill="#7f8795" font-size="22">Built to stay light while you play.</text>
