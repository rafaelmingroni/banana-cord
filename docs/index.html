<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Convite Mingrx</title>
  <style>
    :root{--bg:#0c0d10;--panel:#15171c;--panel2:#1d2027;--line:#30343e;--text:#f7f7fb;--muted:#a3a8b4;--accent:#7c5cff;--accent2:#9f8bff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 8%,#251d4b 0,#111319 36%,var(--bg) 72%);color:var(--text)}body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:linear-gradient(160deg,#1c1f26,#13151a);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 28px 80px #0009}.brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#8c72ff,#6848ed);font-size:25px;font-weight:950;letter-spacing:-3px;box-shadow:0 10px 30px #0005}.brand h1{font-size:22px;margin:0;letter-spacing:-.5px}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.invite{padding:18px;border:1px solid #574c8d;border-radius:14px;background:linear-gradient(145deg,#27213d,#191821);margin-bottom:16px}.invite small{display:block;color:#b9afe7;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.8px}.invite strong{display:block;font-size:30px;letter-spacing:2.4px;color:#c9bfff;margin-top:7px}.status{color:#c8cbd4;line-height:1.5;font-size:14px;margin:12px 0 18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{display:grid;place-items:center;min-height:46px;border-radius:10px;text-decoration:none;font-weight:800;font-size:14px;border:1px solid #3b3f49;background:#252831;color:#f5f6fa;cursor:pointer}.btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;border-color:#7355eb}.hint{display:block;margin-top:16px;color:#7f8591;font-size:11px;line-height:1.5;text-align:center}@media(max-width:520px){.card{padding:20px;border-radius:16px}.invite strong{font-size:25px}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="mark">M</div><div><h1>Mingrx</h1><p>Convite para uma comunidade</p></div></div>
    <section class="invite"><small>Código do convite</small><strong id="code">—</strong></section>
    <p id="status" class="status">Preparando seu convite…</p>
    <div class="actions">
      <a id="openApp" class="btn primary" href="#">Abrir Mingrx</a>
      <a id="download" class="btn" href="https://github.com/rafaelmingroni/banana-cord/releases/latest">Baixar Mingrx</a>
    </div>
    <small class="hint">Se o Mingrx já estiver instalado, este link abre o aplicativo. Links antigos continuam compatíveis durante a migração.</small>
  </main>
<script>
(() => {
  const alphabet='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const normalize=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const format=v=>{const raw=normalize(v);return raw.length===12?`${raw.slice(0,4)}-${raw.slice(4,8)}-${raw.slice(8)}`:raw.length===8?`${raw.slice(0,4)}-${raw.slice(4)}`:raw};
  const raw=normalize(new URLSearchParams(location.search).get('invite'));
  const valid=[8,12].includes(raw.length)&&[...raw].every(ch=>alphabet.includes(ch));
  const code=format(raw);
  const codeEl=document.getElementById('code');
  const status=document.getElementById('status');
  const open=document.getElementById('openApp');
  const download=document.getElementById('download');
  if(!valid){codeEl.textContent='INVÁLIDO';status.textContent='Esse link de convite não é válido.';open.style.display='none';return;}
  codeEl.textContent=code;
  const primary=`mingrx://join/${encodeURIComponent(code)}`;
  const legacy=`bananacord://join/${encodeURIComponent(code)}`;
  open.href=primary;
  status.textContent='Tentando abrir o Mingrx…';
  let leftPage=false;
  let downloadUrl='https://github.com/rafaelmingroni/banana-cord/releases/latest';
  document.addEventListener('visibilitychange',()=>{if(document.hidden)leftPage=true});
  fetch('https://api.github.com/repos/rafaelmingroni/banana-cord/releases/latest',{headers:{Accept:'application/vnd.github+json'}})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(release=>{
      const asset=(release.assets||[]).find(a=>/^Mingrx-Setup-.*-x64\.exe$/i.test(a.name))||(release.assets||[]).find(a=>/^Banana-Cord-Setup-.*-x64\.exe$/i.test(a.name));
      if(asset?.browser_download_url){downloadUrl=asset.browser_download_url;download.href=downloadUrl;}
    }).catch(()=>{});
  setTimeout(()=>{location.href=primary},180);
  // Old Banana Cord clients only know bananacord://. New Mingrx accepts both.
  setTimeout(()=>{if(!leftPage&&!document.hidden)location.href=legacy},1050);
  setTimeout(()=>{if(!leftPage&&!document.hidden)status.textContent='O aplicativo não abriu? Vamos levar você para o download.'},2100);
  setTimeout(()=>{if(!leftPage&&!document.hidden)location.href=downloadUrl},4100);
})();
</script>
</body>
</html>
