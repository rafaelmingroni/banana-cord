<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https: http:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src * ws: wss:; media-src 'self' blob: data:;" />
<title>Banana Cord</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="v1.css" />
<link rel="stylesheet" href="v110.css" />
<link rel="stylesheet" href="v120.css" />
<link rel="stylesheet" href="cloud-v2.css" />
</head>
<body>
<!-- Compatibilidade interna da UI v1.2.1. Na V2 este fluxo nunca é exibido ao usuário. -->
<div id="setup" class="setup hidden" aria-hidden="true">
  <input id="setupName" maxlength="32" tabindex="-1" />
  <input id="setupInvite" placeholder="ABCD-EFGH" tabindex="-1" />
  <input id="setupUrl" value="banana-cloud://firebase" tabindex="-1" />
  <button id="hostBtn" type="button" tabindex="-1"></button>
  <button id="connectBtn" type="button" tabindex="-1"></button>
  <div id="hostProgress" class="host-progress hidden"></div>
</div>

<div id="app" class="app hidden">
  <aside class="servers"><button id="homeServer" class="server-icon home-server active" title="Mensagens privadas"><img class="home-banana-img" src="../assets/banana-cord.png" alt="Banana Cord"><span id="dmUnreadBadge" class="dm-unread-badge hidden">0</span></button><div id="serverList"></div><button id="addServerBtn" class="server-icon add" title="Criar ou entrar em servidor">+</button></aside>
  <aside class="sidebar"><div class="server-title"><strong id="serverName">Banana Cord</strong><div class="server-actions"><button id="inviteBtn" class="icon-btn" title="Convidar">🔗</button><button id="serverSettingsBtn" class="icon-btn" title="Configurações do servidor">⚙</button></div></div><div id="channels" class="channels"></div><div class="voice-controls hidden" id="voiceControls"><div class="voice-state"><span class="dot"></span><div><b>Voz conectada</b><small id="voiceChannelName">Geral</small></div></div><div class="control-row"><button id="muteBtn" title="Microfone">🎤</button><button id="deafenBtn" title="Ensurdecer">🎧</button><button id="cameraBtn" title="Câmera">📹</button><button id="screenBtn" title="Compartilhar tela">🖥️</button><button id="hangupBtn" class="danger" title="Sair">📞</button></div></div><div class="profile-bar"><div id="myAvatar" class="avatar">?</div><div class="profile-text"><b id="myName">Usuário</b><small><span class="online-dot"></span> <span id="myStatusText">Online</span> · <span id="ping">-- ms</span></small></div><button id="profileBtn" class="icon-btn" title="Perfil e configurações">⚙️</button></div></aside>
  <main class="main"><header><span id="channelIcon">#</span><b id="channelName">geral</b><span id="channelDesc">Conversa do servidor</span><span id="connectionBadge" class="connection-badge">conectado</span><button id="updateBadge" class="update-badge hidden" title="Atualização do Banana Cord">⬇ Atualização</button></header><section id="emptyView" class="empty-view"><img class="big-banana-img" src="../assets/banana-cord.png" alt=""><h2>Banana Cord</h2><p>Crie ou entre em um servidor pelo botão +.</p></section><section id="textView" class="text-view hidden"><div id="messages" class="messages"></div><form id="messageForm" class="composer"><input id="messageInput" autocomplete="off" maxlength="2000" placeholder="Mensagem" /><button>Enviar</button></form></section><section id="voiceView" class="voice-view hidden"><div class="voice-top"><div><h2 id="voiceTitle">Sala de voz</h2><p id="voiceSubtitle">Conecte-se para conversar.</p></div><div class="voice-top-actions"><button id="reconnectVoiceBtn" class="secondary-mini hidden" title="Reconectar chamada">↻ Reconectar</button><button id="hideCamsBtn" class="secondary-mini hidden" title="Ocultar webcams e focar compartilhamento">👁 Câmeras</button><button id="joinVoiceBtn">Entrar na voz</button></div></div><div id="videoGrid" class="video-grid"></div></section></main>
  <aside class="members"><h3>Membros</h3><div id="memberList"></div></aside>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div>
<script src="cloud-v2-mode.js"></script>
<script src="app.js"></script>
<script src="v101-fix.js"></script>
<script src="v1.js"></script>
<script src="cloud-v2-legacy-bridge.js"></script>
<script src="v110.js"></script>
<script src="v120.js"></script>
<script src="cloud-browser/cloud-v2.browser.js"></script>
<script src="cloud-browser/cloud-v2-auth-fix.browser.js"></script>
<script src="cloud-v2-ui-fix.js"></script>
<script src="cloud-browser/cloud-v2-socket.browser.js"></script>
</body>
</html>
