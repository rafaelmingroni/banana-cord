name: Mingrx Site Validation

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site-validation.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate static site
        run: node site/validate.mjs
