name: Mingrx 3.1 Lock Sync

on:
  push:
    branches: [v3.1.0-spark-media-removal, hotfix/3.1.1-server-photo-voice-ui, hotfix/3.1.2-dm-permission-private-ui]
    paths:
      - "desktop/package.json"
      - ".github/workflows/mingrx-31-lock-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate package lock only
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lock version
        working-directory: desktop
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.version!==p.version||l.packages?.['']?.version!==p.version){throw new Error('package-lock version mismatch')} console.log('package-lock synchronized:',p.version)"

      - name: Commit synchronized lock
        shell: bash
        run: |
          if git diff --quiet -- desktop/package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git commit -m "chore: sync package lock for Mingrx 3.1.2"
          git push origin HEAD:${{ github.ref_name }}
