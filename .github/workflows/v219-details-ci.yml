name: V2.0.19 Details Validation

on:
  push:
    branches: [v2.0.19-polish-dates-roles]
    paths:
      - "desktop/**"
      - "RELEASE_NOTES-2.0.19.md"
      - ".github/workflows/v219-details-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Prepare source
        working-directory: desktop
        run: npm run prepare:source
      - name: Validate V2.0.19 JavaScript
        shell: pwsh
        run: |
          node --check desktop/src/v219-details.js
          node --check desktop/scripts/smoke-v219.js
          node --check desktop/scripts/e2e-v219-details-ui.js
      - name: Regression suite
        working-directory: desktop
        run: npm run smoke:cloud
      - name: Real Electron interaction suite
        working-directory: desktop
        run: npm run smoke:e2e-v2
