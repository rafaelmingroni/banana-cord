name: Banana Cord V2 Validation

on:
  push:
    branches: [main, v2.1.0-social-update]
    paths:
      - "desktop/**"
      - "firebase/**"
      - "RELEASE_NOTES-*.md"
      - ".github/workflows/v21-social-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "firebase/**"
      - "RELEASE_NOTES-*.md"
      - ".github/workflows/v21-social-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Critical production dependency audit
        working-directory: desktop
        run: npm run security:audit

      - name: Prepare source
        working-directory: desktop
        run: npm run prepare:source

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check desktop/v21-main.js
          node --check desktop/main-v110.js
          node --check desktop/tray.js
          node --check desktop/src/cloud-v2-v21-social.js
          node --check desktop/src/v21-i18n.js
          node --check desktop/src/v21-i18n-legacy.js
          node --check desktop/src/v21-social.js
          node --check desktop/src/v21-release-fixes.js
          node --check desktop/scripts/smoke-v21.js
          node --check desktop/scripts/e2e-v21-main.js
          node --check desktop/scripts/e2e-v21-social-ui.js
          node --check desktop/scripts/e2e-v21-submit-priority.js
          node --check desktop/scripts/e2e-v21-language.js
          node --check desktop/scripts/e2e-v21-private-guard.js

      - name: Full cloud and UI regression suite
        working-directory: desktop
        run: npm run smoke:cloud && npm run smoke:hotfix315

      - name: Firebase security rules emulator regression
        working-directory: desktop
        run: npm run smoke:rules

      - name: Real Electron interaction suite
        working-directory: desktop
        run: npm run smoke:e2e-v2

      - name: Inject production Firebase config for test installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2.1.0-social-update'
        working-directory: desktop
        env:
          BANANA_FIREBASE_CONFIG_JSON: ${{ secrets.BANANA_FIREBASE_CONFIG_JSON }}
        run: node scripts/inject-firebase-config.js

      - name: Rebuild prepared source with production config
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2.1.0-social-update'
        working-directory: desktop
        run: npm run prepare:source

      - name: Build Windows test installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2.1.0-social-update'
        working-directory: desktop
        run: npm run dist:win -- --publish never

      - name: Verify Windows test installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2.1.0-social-update'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe.blockmap" | Select-Object -First 1
          $latest = Get-Item "desktop/dist/latest.yml" -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "Instalador .exe não foi gerado."; exit 1 }
          if ($exe.Length -lt 50000000) { Write-Error "Instalador parece pequeno demais."; exit 1 }
          if (-not $blockmap) { Write-Error "Blockmap não foi gerado."; exit 1 }
          if (-not $latest) { Write-Error "latest.yml não foi gerado."; exit 1 }
          Write-Host "Test installer: $($exe.Name) - $($exe.Length) bytes"

      - name: Upload Windows test installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2.1.0-social-update'
        uses: actions/upload-artifact@v4
        with:
          name: Banana-Cord-2.1.0-test-${{ github.sha }}
          path: |
            desktop/dist/Banana-Cord-Setup-2.1.0-*.exe
            desktop/dist/Banana-Cord-Setup-2.1.0-*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
