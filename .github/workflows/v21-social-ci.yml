name: Banana Cord 2.1 Social Update Validation

on:
  push:
    branches: [v2.1.0-social-update]
    paths:
      - "desktop/**"
      - "firebase/**"
      - "RELEASE_NOTES-2.1.0.md"
      - ".github/workflows/v21-social-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Critical production dependency audit
        working-directory: desktop
        run: npm run security:audit

      - name: Prepare source
        working-directory: desktop
        run: npm run prepare:source

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check desktop/v21-main.js
          node --check desktop/main-v110.js
          node --check desktop/tray.js
          node --check desktop/src/cloud-v2-v21-social.js
          node --check desktop/src/v21-i18n.js
          node --check desktop/src/v21-social.js
          node --check desktop/scripts/smoke-v21.js
          node --check desktop/scripts/e2e-v21-main.js
          node --check desktop/scripts/e2e-v21-social-ui.js

      - name: Full cloud and UI regression suite
        working-directory: desktop
        run: npm run smoke:cloud

      - name: Firebase security rules emulator regression
        working-directory: desktop
        run: npm run smoke:rules

      - name: Real Electron interaction suite
        working-directory: desktop
        run: npm run smoke:e2e-v2
