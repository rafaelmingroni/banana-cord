name: Mingrx Pull Request Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "firebase/**"
      - "README.md"
      - "RELEASE_NOTES-*.md"
      - "docs/**"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mingrx-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Critical production dependency audit
        working-directory: desktop
        run: npm run security:audit

      - name: Prepare Mingrx source
        working-directory: desktop
        run: npm run prepare:source

      - name: Validate launch JavaScript
        shell: pwsh
        run: |
          node --check desktop/main-v120.js
          node --check desktop/main-v110.js
          node --check desktop/v21-main.js
          node --check desktop/tray.js
          node --check desktop/src/cloud-v2-v21-social.js
          node --check desktop/src/cloud-v2-storage.js
          node --check desktop/src/mingrx-media.js
          node --check desktop/src/mingrx-invite-fix.js
          node --check desktop/src/v217-premium-updater.js
          node --check desktop/src/v21-i18n.js
          node --check desktop/src/v21-i18n-legacy.js
          node --check desktop/src/v21-social.js
          node --check desktop/src/v21-release-fixes.js
          node --check desktop/scripts/smoke-v21.js
          node --check desktop/scripts/smoke-mingrx-rebrand.js
          node --check desktop/scripts/smoke-mingrx-media.js
          node --check desktop/scripts/e2e-v2-release.js
          node --check desktop/scripts/e2e-mingrx-media-invite.js

      - name: Mingrx launch regression suite
        working-directory: desktop
        run: npm run smoke:mingrx

      - name: Full cloud and UI regression suite
        working-directory: desktop
        run: npm run smoke:cloud

      - name: Firebase Firestore, Realtime Database and Storage rules
        working-directory: desktop
        run: npm run smoke:rules

      - name: Real Electron interaction suite
        working-directory: desktop
        run: npm run smoke:e2e-v2
