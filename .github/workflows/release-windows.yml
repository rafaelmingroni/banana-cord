name: Build and publish Banana Cord for Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "firebase/**"
      - "CHANGELOG.md"
      - "README.md"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Inject production Firebase config
        working-directory: desktop
        env:
          BANANA_FIREBASE_CONFIG_JSON: ${{ secrets.BANANA_FIREBASE_CONFIG_JSON }}
        run: node scripts/inject-firebase-config.js

      - name: Prepare source
        working-directory: desktop
        run: npm run prepare:source

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check desktop/main-v120.js
          node --check desktop/main-v110.js
          node --check desktop/main.js
          node --check desktop/updater-prompt.js
          node --check desktop/tray.js
          node --check desktop/src/app.js
          node --check desktop/src/v101-fix.js
          node --check desktop/src/v1.js
          node --check desktop/src/v110.js
          node --check desktop/src/v120.js
          node --check desktop/src/cloud-v2-mode.js
          node --check desktop/src/cloud-v2.js
          node --check desktop/src/cloud-v2-auth-fix.js
          node --check desktop/src/cloud-v2-ui-fix.js
          node --check desktop/src/cloud-v2-legacy-bridge.js
          node --check desktop/src/cloud-v2-socket.js
          node --check desktop/src/cloud-v2-runtime-fixes.js
          node --check desktop/src/cloud-v2-release-fixes.js
          node --check desktop/scripts/inject-firebase-config.js
          node --check desktop/scripts/smoke-cloud.js
          node --check desktop/scripts/smoke-cloud-parity.js
          node --check desktop/scripts/smoke-firebase-rules.js
          node --check desktop/scripts/smoke-ui.js
          node --check desktop/scripts/e2e-v2-release.js

      - name: Cloud foundation and parity tests
        working-directory: desktop
        run: npm run smoke:cloud

      - name: Firebase security rules emulator tests
        working-directory: desktop
        run: npm run smoke:rules

      - name: UI regression tests
        working-directory: desktop
        run: npm run smoke:ui

      - name: Invite regression tests
        working-directory: desktop
        run: npm run smoke:rendezvous

      - name: Real Electron V2 release interaction test
        working-directory: desktop
        run: npm run smoke:e2e-v2

      - name: Validate official version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Release oficial exige versão sem sufixo: $version"; exit 1 }
          if ($version -notmatch '^2\.') { Write-Error "Este workflow publica a linha V2: $version"; exit 1 }
          Write-Host "Banana Cord official version: $version"

      - name: Prepare version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          git fetch --tags --force

          $releaseJson = gh api "repos/$repo/releases/tags/$tag" 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $releaseComplete = $false

          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            $hasExe = ($assetNames | Where-Object { $_ -like "Banana-Cord-Setup-$version-*.exe" }).Count -gt 0
            $hasBlockmap = ($assetNames | Where-Object { $_ -like "*.exe.blockmap" }).Count -gt 0
            $hasLatest = $assetNames -contains "latest.yml"
            $releaseComplete = $hasExe -and $hasBlockmap -and $hasLatest

            if ($releaseComplete) {
              $tagCommit = (git rev-list -n 1 $tag).Trim()
              if ($tagCommit -ne $env:GITHUB_SHA) {
                Write-Error "A versão $version já foi publicada. Aumente desktop/package.json antes de publicar novas mudanças."
                exit 1
              }
              Write-Host "Release $tag já está completa no commit atual."
              exit 0
            }

            foreach ($asset in $release.assets) { gh api -X DELETE "repos/$repo/releases/assets/$($asset.id)" }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

      - name: Build Windows installer and updater metadata
        working-directory: desktop
        run: npm run dist:win -- --publish never

      - name: Verify installer and updater files
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe.blockmap" | Select-Object -First 1
          $latest = Get-Item "desktop/dist/latest.yml" -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "Instalador .exe não foi gerado."; exit 1 }
          if ($exe.Length -lt 50000000) { Write-Error "Instalador parece pequeno demais."; exit 1 }
          if (-not $blockmap) { Write-Error "Blockmap não foi gerado."; exit 1 }
          if (-not $latest) { Write-Error "latest.yml não foi gerado."; exit 1 }
          Write-Host "Installer: $($exe.Name) - $($exe.Length) bytes"

      - name: Prepare release notes from changelog
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $lines = Get-Content CHANGELOG.md
          $header = "## $version"
          $start = [Array]::IndexOf($lines, $header)
          if ($start -lt 0) { Write-Error "CHANGELOG.md não possui a seção $header"; exit 1 }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+') { break }
            $body.Add($lines[$i])
          }
          @(
            "# Banana Cord V$version"
            ""
            "Esta é a primeira versão oficial da nova arquitetura do Banana Cord. A experiência deixa de depender de um usuário hospedando a sessão e passa a usar contas e servidores persistentes no Banana Cloud, mantendo voz, câmera e compartilhamento de tela em WebRTC."
            ""
            "## O que mudou"
          ) + $body | Set-Content release-notes.md -Encoding UTF8

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Banana Cord V$version" --notes-file release-notes.md --latest
          } else {
            gh release create $tag --title "Banana Cord V$version" --target $env:GITHUB_SHA --notes-file release-notes.md --latest
          }

          $exe = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe.blockmap" | Select-Object -First 1
          $latest = Get-Item "desktop/dist/latest.yml"
          gh release upload $tag $exe.FullName $blockmap.FullName $latest.FullName --clobber

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          $hasExe = ($names | Where-Object { $_ -like "Banana-Cord-Setup-$version-*.exe" }).Count -gt 0
          $hasBlockmap = ($names | Where-Object { $_ -like "*.exe.blockmap" }).Count -gt 0
          $hasLatest = $names -contains "latest.yml"
          if (-not ($hasExe -and $hasBlockmap -and $hasLatest)) {
            Write-Error "Release incompleta: $($names -join ', ')"
            exit 1
          }
          Write-Host "Banana Cord V$version publicado com EXE + blockmap + latest.yml."
