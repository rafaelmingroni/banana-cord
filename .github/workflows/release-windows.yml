name: Build and publish Banana Cord for Windows

on:
  push:
    branches: [main, v1-post-beta, v1.0.1-stability, v1.1-premium, v1.1.1-private-rendezvous, v1.2-link-invites]
    paths:
      - "desktop/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Prepare source
        working-directory: desktop
        run: npm run prepare:source

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check desktop/main-v120.js
          node --check desktop/main-v110.js
          node --check desktop/rendezvous.js
          node --check desktop/updater-prompt.js
          node --check desktop/tray.js
          node --check desktop/main.js
          node --check desktop/server/server.js
          node --check desktop/src/app.js
          node --check desktop/src/v1.js
          node --check desktop/src/v101-fix.js
          node --check desktop/src/v110.js
          node --check desktop/src/v120.js
          node --check desktop/scripts/smoke-v1.js
          node --check desktop/scripts/smoke-ui.js
          node --check desktop/scripts/smoke-rendezvous.js

      - name: Smoke test v1 protocol
        working-directory: desktop
        run: npm run smoke:v1

      - name: Smoke test renderer regressions
        working-directory: desktop
        run: npm run smoke:ui

      - name: Smoke test short invite rendezvous
        working-directory: desktop
        run: npm run smoke:rendezvous

      - name: Validate app assets
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/assets/banana-cord.png")) { Write-Error "Logo da banana ausente."; exit 1 }
          if (-not (Test-Path "desktop/assets/banana-cord.ico")) { Write-Error "ICO principal ausente."; exit 1 }
          if (-not (Test-Path "desktop/assets/banana-tray.png")) { Write-Error "Icone da bandeja ausente."; exit 1 }
          if (-not (Test-Path "desktop/src/v1.css")) { Write-Error "CSS da v1 ausente."; exit 1 }
          if (-not (Test-Path "desktop/src/v110.css")) { Write-Error "CSS da v1.1 ausente."; exit 1 }
          if (-not (Test-Path "desktop/src/v120.css")) { Write-Error "CSS da v1.2 ausente."; exit 1 }
          $html = Get-Content "desktop/src/index.html" -Raw
          if ($html -notmatch 'v1\.js') { Write-Error "index.html não carrega v1.js"; exit 1 }
          if ($html -notmatch 'v101-fix\.js') { Write-Error "index.html não carrega v101-fix.js"; exit 1 }
          if ($html -notmatch 'v110\.js') { Write-Error "index.html não carrega v110.js"; exit 1 }
          if ($html -notmatch 'v110\.css') { Write-Error "index.html não carrega v110.css"; exit 1 }
          if ($html -notmatch 'v120\.js') { Write-Error "index.html não carrega v120.js"; exit 1 }
          if ($html -notmatch 'v120\.css') { Write-Error "index.html não carrega v120.css"; exit 1 }

      - name: Prepare version tag and release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          git fetch --tags --force

          $releaseJson = gh api "repos/$repo/releases/tags/$tag" 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $releaseComplete = $false

          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            $hasExe = ($assetNames | Where-Object { $_ -like "Banana-Cord-Setup-$version-*.exe" }).Count -gt 0
            $hasBlockmap = ($assetNames | Where-Object { $_ -like "*.exe.blockmap" }).Count -gt 0
            $hasLatest = $assetNames -contains "latest.yml"
            $releaseComplete = $hasExe -and $hasBlockmap -and $hasLatest

            if (-not $releaseComplete) {
              Write-Host "Release $tag existe, mas está incompleta. Limpando assets para republicar."
              foreach ($asset in $release.assets) { gh api -X DELETE "repos/$repo/releases/assets/$($asset.id)" }
            }
          }

          if ($releaseComplete) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              Write-Error "A versão $version já foi publicada por completo. Aumente desktop/package.json antes de publicar mudanças novas."
              exit 1
            }
            Write-Host "Release $tag já está completa."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag" --force
            Write-Host "Tag $tag preparada para publicação/reparo."
          }

      - name: Build Windows installer (validation branch)
        if: github.ref != 'refs/heads/main'
        working-directory: desktop
        run: npm run dist:win -- --publish never

      - name: Build Windows installer and updater metadata
        if: github.ref == 'refs/heads/main'
        working-directory: desktop
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify validation installer
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Instalador de validação não foi gerado."; exit 1 }
          if ($exe.Length -lt 50000000) { Write-Error "Instalador de validação parece pequeno demais."; exit 1 }
          Write-Host "Instalador de validação OK: $($exe.Name) - $($exe.Length) bytes"

      - name: Verify and complete release assets
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "desktop/dist/Banana-Cord-Setup-$version-*.exe.blockmap" | Select-Object -First 1
          $latest = Get-Item "desktop/dist/latest.yml" -ErrorAction SilentlyContinue

          if (-not $exe) { Write-Error "Instalador .exe não foi gerado."; exit 1 }
          if (-not $blockmap) { Write-Error "Blockmap não foi gerado."; exit 1 }
          if (-not $latest) { Write-Error "latest.yml não foi gerado."; exit 1 }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $version --target $env:GITHUB_SHA }
          gh release upload $tag $exe.FullName $blockmap.FullName $latest.FullName --clobber

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          $hasExe = ($names | Where-Object { $_ -like "Banana-Cord-Setup-$version-*.exe" }).Count -gt 0
          $hasBlockmap = ($names | Where-Object { $_ -like "*.exe.blockmap" }).Count -gt 0
          $hasLatest = $names -contains "latest.yml"
          if (-not ($hasExe -and $hasBlockmap -and $hasLatest)) {
            Write-Error "Release incompleta após o upload explícito."
            Write-Host ($names -join ", ")
            exit 1
          }
          Write-Host "Release $tag completa: EXE + blockmap + latest.yml."
