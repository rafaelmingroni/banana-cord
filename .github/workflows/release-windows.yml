name: Build and publish Mingrx for Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "firebase/**"
      - "CHANGELOG.md"
      - "RELEASE_NOTES-*.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mingrx-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Critical production dependency audit
        working-directory: desktop
        run: npm run security:audit

      - name: Inject production Firebase config
        working-directory: desktop
        env:
          BANANA_FIREBASE_CONFIG_JSON: ${{ secrets.BANANA_FIREBASE_CONFIG_JSON }}
        run: node scripts/inject-firebase-config.js

      - name: Verify Firebase production config
        working-directory: desktop
        shell: pwsh
        run: |
          node -e "const c=require('./cloud/firebase-config.js'); const need=['apiKey','authDomain','projectId','appId','storageBucket']; const miss=need.filter(k=>!String(c[k]||'').trim()); if(miss.length){console.error('Missing Firebase config: '+miss.join(','));process.exit(1)}; console.log('Mingrx Firebase config: OK')"

      - name: Prepare source and Mingrx assets
        working-directory: desktop
        run: npm run prepare:source

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check desktop/main-v120.js
          node --check desktop/main-v110.js
          node --check desktop/v21-main.js
          node --check desktop/main.js
          node --check desktop/e2ee-main.js
          node --check desktop/updater-prompt.js
          node --check desktop/tray.js
          node --check desktop/src/app.js
          node --check desktop/src/cloud-v2-mode.js
          node --check desktop/src/cloud-v2.js
          node --check desktop/src/cloud-v2-brand.js
          node --check desktop/src/cloud-v2-storage.js
          node --check desktop/src/cloud-v2-auth-fix.js
          node --check desktop/src/cloud-v2-socket.js
          node --check desktop/src/cloud-v2-runtime-fixes.js
          node --check desktop/src/cloud-v2-release-fixes.js
          node --check desktop/src/mingrx-shell.js
          node --check desktop/src/mingrx-themes.js
          node --check desktop/src/mingrx-polish.js
          node --check desktop/src/mingrx-social-polish.js
          node --check desktop/src/mingrx-mark-polish.js
          node --check desktop/src/mingrx-final-fixes.js
          node --check desktop/src/mingrx-regression-guard.js
          node --check desktop/src/mingrx-media.js
          node --check desktop/src/mingrx-invite-fix.js
          node --check desktop/src/v217-premium-updater.js
          node --check desktop/scripts/build-cloud-browser.js
          node --check desktop/scripts/smoke-mingrx-rebrand.js
          node --check desktop/scripts/smoke-mingrx-polish.js
          node --check desktop/scripts/smoke-mingrx-media.js
          node --check desktop/scripts/e2e-mingrx-layout.js
          node --check desktop/scripts/e2e-mingrx-social.js
          node --check desktop/scripts/e2e-mingrx-branding.js
          node --check desktop/scripts/e2e-mingrx-media-invite.js

      - name: Mingrx launch regression tests
        working-directory: desktop
        run: npm run smoke:mingrx

      - name: Existing Cloud regression suite
        working-directory: desktop
        run: npm run smoke:cloud

      - name: Firebase security rules emulator tests
        working-directory: desktop
        run: npm run smoke:rules

      - name: UI regression tests
        working-directory: desktop
        run: npm run smoke:ui

      - name: Invite regression tests
        working-directory: desktop
        run: npm run smoke:rendezvous

      - name: Real Electron interaction suite
        working-directory: desktop
        run: npm run smoke:e2e-v2

      - name: Deploy Firebase rules when CI credential is configured
        shell: pwsh
        working-directory: desktop
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if (-not $env:FIREBASE_TOKEN) {
            Write-Host "::warning::FIREBASE_TOKEN is not configured. Firestore, Realtime Database and Storage rules passed emulator tests but must be published manually in Firebase Console."
            exit 0
          }
          npx firebase-tools deploy --project banana-cord --config ../firebase/firebase.json --only firestore:rules,database,storage --token $env:FIREBASE_TOKEN --non-interactive

      - name: Validate official Mingrx version and migration identity
        shell: pwsh
        run: |
          $pkg = Get-Content desktop/package.json | ConvertFrom-Json
          $version = $pkg.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Release oficial exige semver sem sufixo: $version"; exit 1 }
          if ($version -notmatch '^3\.') { Write-Error "Mingrx public launch must be 3.x: $version"; exit 1 }
          if ($pkg.build.productName -ne 'Mingrx') { Write-Error "productName must be Mingrx"; exit 1 }
          if ($pkg.build.appId -ne 'com.bananacord.app') { Write-Error "Migration appId changed; old installs would not upgrade in place."; exit 1 }
          if ($pkg.build.artifactName -notlike 'Mingrx-Setup-*') { Write-Error "Installer artifact is not branded Mingrx."; exit 1 }
          Write-Host "Mingrx $version migration identity: OK"

      - name: Prepare version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          git fetch --tags --force

          $releaseJson = gh api "repos/$repo/releases/tags/$tag" 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            $hasExe = ($assetNames | Where-Object { $_ -like "Mingrx-Setup-$version-*.exe" }).Count -gt 0
            $hasBlockmap = ($assetNames | Where-Object { $_ -like "Mingrx-Setup-$version-*.exe.blockmap" }).Count -gt 0
            $hasLatest = $assetNames -contains "latest.yml"
            if ($hasExe -and $hasBlockmap -and $hasLatest) {
              $tagCommit = (git rev-list -n 1 $tag).Trim()
              if ($tagCommit -ne $env:GITHUB_SHA) {
                Write-Error "Mingrx $version already exists on another commit. Bump the version before publishing."
                exit 1
              }
              Write-Host "Mingrx $tag already complete on this commit."
              exit 0
            }
            foreach ($asset in $release.assets) { gh api -X DELETE "repos/$repo/releases/assets/$($asset.id)" }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

      - name: Build Windows installer and updater metadata
        working-directory: desktop
        run: npm run dist:win -- --publish never

      - name: Verify installer and updater files
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem "desktop/dist/Mingrx-Setup-$version-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "desktop/dist/Mingrx-Setup-$version-*.exe.blockmap" | Select-Object -First 1
          $latest = Get-Item "desktop/dist/latest.yml" -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "Mingrx installer .exe was not generated."; exit 1 }
          if ($exe.Length -lt 50000000) { Write-Error "Mingrx installer is unexpectedly small."; exit 1 }
          if (-not $blockmap) { Write-Error "Mingrx blockmap was not generated."; exit 1 }
          if (-not $latest) { Write-Error "latest.yml was not generated."; exit 1 }
          $latestText = Get-Content $latest.FullName -Raw
          if ($latestText -notmatch 'Mingrx-Setup-') { Write-Error "latest.yml does not point to the Mingrx installer."; exit 1 }
          Write-Host "Mingrx installer: $($exe.Name) - $($exe.Length) bytes"

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $specific = "RELEASE_NOTES-$version.md"
          if (-not (Test-Path $specific)) { Write-Error "$specific is required for a public Mingrx release."; exit 1 }
          Get-Content $specific | Set-Content release-notes.md -Encoding UTF8

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Mingrx $version" --notes-file release-notes.md --latest
          } else {
            gh release create $tag --title "Mingrx $version" --target $env:GITHUB_SHA --notes-file release-notes.md --latest
          }
          $exe = Get-ChildItem "desktop/dist/Mingrx-Setup-$version-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "desktop/dist/Mingrx-Setup-$version-*.exe.blockmap" | Select-Object -First 1
          $latest = Get-Item "desktop/dist/latest.yml"
          gh release upload $tag $exe.FullName $blockmap.FullName $latest.FullName --clobber

      - name: Verify published Mingrx release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($release.name -ne "Mingrx $version") { Write-Error "Release title is not Mingrx $version"; exit 1 }
          $names = @($release.assets | ForEach-Object { $_.name })
          $hasExe = ($names | Where-Object { $_ -like "Mingrx-Setup-$version-*.exe" }).Count -gt 0
          $hasBlockmap = ($names | Where-Object { $_ -like "Mingrx-Setup-$version-*.exe.blockmap" }).Count -gt 0
          $hasLatest = $names -contains "latest.yml"
          if (-not ($hasExe -and $hasBlockmap -and $hasLatest)) {
            Write-Error "Incomplete Mingrx release: $($names -join ', ')"
            exit 1
          }
          Write-Host "Mingrx $version published with EXE + blockmap + latest.yml."
