name: Build and publish Banana Cord for Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Assemble split source files
        working-directory: desktop
        run: npm run prepare:source

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check desktop/main.js
          node --check desktop/server/server.js
          node --check desktop/src/app.js

      - name: Prepare version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          git fetch --tags --force

          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          $existing = git tag -l $tag
          if ($releaseExists) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              Write-Error "A versão $version já foi publicada. Aumente desktop/package.json antes de publicar mudanças novas."
              exit 1
            }
            Write-Host "Release $tag já existe e aponta para este commit."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag" --force
            Write-Host "Tag $tag preparada para a primeira publicação."
          }

      - name: Build and publish GitHub Release
        working-directory: desktop
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
