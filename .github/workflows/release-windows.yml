name: Mingrx Windows Release
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'firebase/**', 'RELEASE_NOTES-*.md', '.github/workflows/release-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mingrx-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        working-directory: desktop
        run: npm run security:audit
      - name: Prepare source
        working-directory: desktop
        run: npm run prepare:source
      - name: Security, UI, history and Cloud regressions
        working-directory: desktop
        run: npm run smoke:mingrx && npm run smoke:cloud && npm run smoke:hotfix315 && npm run smoke:ui && npm run smoke:rendezvous
      - name: Firebase authorization and encryption rules
        working-directory: desktop
        run: npm run smoke:rules
      - name: Real Electron interactions with production isolation
        working-directory: desktop
        run: npm run smoke:e2e-v2
      - name: Inject production Firebase and optional TURN endpoint
        working-directory: desktop
        env:
          BANANA_FIREBASE_CONFIG_JSON: ${{ secrets.BANANA_FIREBASE_CONFIG_JSON }}
          MINGRX_TURN_CREDENTIALS_URL: ${{ vars.MINGRX_TURN_CREDENTIALS_URL }}
        run: node scripts/inject-firebase-config.js
      - name: Build Windows installer and updater metadata
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win -- --publish never
      - name: Verify release identity and artifact hashes
        working-directory: desktop
        run: node scripts/verify-release-artifacts.js
      - name: Upload reviewable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mingrx-Windows-${{ github.sha }}
          path: |
            desktop/dist/Mingrx-Setup-*.exe
            desktop/dist/Mingrx-Setup-*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
      - name: Stage complete release as draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "RELEASE_NOTES-$version.md"
          if (-not (Test-Path $notes)) { throw "Release notes missing: $notes" }
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.draft) { throw "Version $version is already public. Never replace published artifacts." }
          } else {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "Mingrx $version — Security hotfix" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to stage release' }
          }
          gh release upload $tag "desktop/dist/Mingrx-Setup-$version-x64.exe" "desktop/dist/Mingrx-Setup-$version-x64.exe.blockmap" desktop/dist/latest.yml --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload complete artifacts' }
      - name: Deploy required backend authorization before publishing
        working-directory: desktop
        shell: pwsh
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if (-not $env:FIREBASE_TOKEN) { throw 'FIREBASE_TOKEN is required: this hotfix cannot publish against old backend rules.' }
          $project = node -e "console.log(require('./cloud/firebase-config.js').projectId)"
          if (-not $project) { throw 'Production Firebase project is missing' }
          npx firebase-tools deploy --project $project --config ../firebase/firebase.json --only firestore:rules,database --token $env:FIREBASE_TOKEN --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Backend authorization deployment failed; release remains draft.' }
      - name: Promote verified release to latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @("Mingrx-Setup-$version-x64.exe", "Mingrx-Setup-$version-x64.exe.blockmap", 'latest.yml')) {
            if ($names -notcontains $name) { throw "Missing release asset: $name" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release' }
