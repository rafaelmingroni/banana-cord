name: Refresh Mingrx package lock

on:
  push:
    branches: [v3.0.0-mingrx-ui-polish]
    paths:
      - ".github/workflows/refresh-mingrx-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: v3.0.0-mingrx-ui-polish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate package lock from package.json
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lock metadata
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./desktop/package.json');
          const lock = require('./desktop/package-lock.json');
          if (lock.version !== pkg.version) throw new Error(`lock version ${lock.version} != package ${pkg.version}`);
          if (lock.packages?.['']?.version !== pkg.version) throw new Error('root lock package version is stale');
          for (const name of Object.keys(pkg.dependencies || {})) {
            if (!(name in (lock.packages?.['']?.dependencies || {}))) throw new Error(`lock missing dependency: ${name}`);
          }
          for (const name of Object.keys(pkg.devDependencies || {})) {
            if (!(name in (lock.packages?.['']?.devDependencies || {}))) throw new Error(`lock missing devDependency: ${name}`);
          }
          console.log(`package-lock synchronized for Mingrx ${pkg.version}`);
          NODE

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- desktop/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git commit -m "chore: sync package-lock for Mingrx 3.0"
          git push origin HEAD:v3.0.0-mingrx-ui-polish
