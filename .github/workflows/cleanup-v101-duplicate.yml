name: Clean duplicate Banana Cord v1.0.1 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-v101-duplicate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove incomplete duplicate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          releases=$(gh api "repos/$repo/releases?per_page=100")
          ids=$(echo "$releases" | jq -r '.[] | select(.tag_name=="v1.0.1") | .id')
          count=$(echo "$ids" | sed '/^$/d' | wc -l)
          if [ "$count" -le 1 ]; then
            echo "No duplicate v1.0.1 release to clean."
          else
            keep=$(echo "$releases" | jq -r '[.[] | select(.tag_name=="v1.0.1") | {id, assets: [.assets[].name]} | select((.assets | index("Banana-Cord-Setup-1.0.1-x64.exe")) and (.assets | index("Banana-Cord-Setup-1.0.1-x64.exe.blockmap")) and (.assets | index("latest.yml")))] | first | .id')
            if [ -z "$keep" ] || [ "$keep" = "null" ]; then
              echo "No complete v1.0.1 release found; refusing cleanup."
              exit 1
            fi
            echo "$ids" | while read id; do
              [ -z "$id" ] && continue
              if [ "$id" != "$keep" ]; then
                echo "Deleting duplicate release $id; keeping $keep"
                gh api -X DELETE "repos/$repo/releases/$id"
              fi
            done
          fi

      - name: Verify single complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          release=$(gh api "repos/$repo/releases/tags/v1.0.1")
          names=$(echo "$release" | jq -r '.assets[].name')
          echo "$names" | grep -Fx "Banana-Cord-Setup-1.0.1-x64.exe"
          echo "$names" | grep -Fx "Banana-Cord-Setup-1.0.1-x64.exe.blockmap"
          echo "$names" | grep -Fx "latest.yml"
          latest=$(gh api "repos/$repo/releases/latest" --jq '.tag_name')
          [ "$latest" = "v1.0.1" ]
          echo "v1.0.1 release cleanup verified."
