name: Mingrx Release E2E Debug

on:
  push:
    branches: [v3.0.0-mingrx-rebrand]
    paths:
      - "desktop/scripts/e2e-v2-release.js"
      - "desktop/src/mingrx-shell.js"
      - ".github/workflows/mingrx-release-e2e-debug.yml"

permissions:
  contents: read

jobs:
  release-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Prepare source
        working-directory: desktop
        run: npm run prepare:source
      - name: Run final release interaction test
        working-directory: desktop
        run: npx electron scripts/e2e-v2-release.js
